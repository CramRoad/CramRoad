var sub='all', score=0, att=0;
var TAGC={Botany:'linear-gradient(90deg,#059669,#34d399)',Zoology:'linear-gradient(90deg,#db2777,#f472b6)',Physics:'linear-gradient(90deg,#f97316,#ef4444)',Chemistry:'linear-gradient(90deg,#2563eb,#06b6d4)'};
function filters(){
  var sb=document.getElementById('subs');sb.innerHTML='';
  ['all','Botany','Zoology','Physics','Chemistry'].forEach(function(s){
    var b=document.createElement('button');b.textContent=(s==='all'?'All subjects':s);
    if(s===sub)b.classList.add('active');
    b.addEventListener('click',function(){sub=s;filters();renderQ();});
    sb.appendChild(b);
  });
}
function renderQ(){
  score=0;att=0;document.getElementById('qScore').textContent='0';
  var list=BANK.filter(function(q){return sub==='all'||q.s===sub;});
  document.getElementById('qTotal').textContent=list.length;
  document.getElementById('qLine').textContent=list.length?('Showing '+list.length+' PYQs. Attempt all.'):('No questions.');
  var box=document.getElementById('qBox');box.innerHTML='';
  list.slice().sort(function(){return Math.random()-0.5;}).forEach(function(item,i){
    var d=document.createElement('div');d.className='quiz-q';
    d.innerHTML='<b class="q">Q'+(i+1)+'. <span class="tag" style="background:'+TAGC[item.s]+'">'+item.s+'</span> '+item.t+'</b>';
    var opts=item.o.map(function(t,j){return {t:t,ok:j===item.a};});
    for(var sh=opts.length-1;sh>0;sh--){var sr=Math.floor(Math.random()*(sh+1));var tmp=opts[sh];opts[sh]=opts[sr];opts[sr]=tmp;}
    opts.forEach(function(opt,j){
      var lab=document.createElement('label');
      lab.innerHTML='<input type="radio" name="qq'+i+'" value="'+j+'"> '+opt.t;
      lab.querySelector('input').addEventListener('change',function(){
        if(d.classList.contains('correct')||d.classList.contains('wrong'))return;
        att++;
        var exp=d.querySelector('.quiz-exp');
        if(opt.ok){d.classList.add('correct');score++;exp.style.display='block';exp.innerHTML='Correct! '+item.e;}
        else{d.classList.add('wrong');exp.style.display='block';exp.innerHTML='Wrong. Correct: <b>'+item.o[item.a]+'</b>. '+item.e;}
        document.getElementById('qScore').textContent=score;
        document.getElementById('qLine').textContent='Attempted '+att+'/'+list.length+' • Score '+score;
      });
      d.appendChild(lab);
    });
    var ex=document.createElement('div');ex.className='quiz-exp';d.appendChild(ex);box.appendChild(d);
  });
}
